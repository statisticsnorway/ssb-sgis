[project]
classifiers = [
    "Development Status :: 5 - Production/Stable",
]
name = "ssb-sgis"
version = "1.5.0"
description = "GIS functions used at Statistics Norway."
authors = [{ name = "Morten Letnes", email = "morten.letnes@ssb.no" }]
license = "MIT"
readme = "README.md"

requires-python = ">=3.12"

dependencies = [
    "click>=8.0.1",
    "affine>=2.4.0",
    "branca>=0.6.0",
    "folium>=0.14.0",
    "geopandas>=0.14.0",
    "igraph>=0.11.2",
    "ipython>=8.13.2",
    "jenkspy>=0.3.2",
    "jinja2>=3.1.3",
    "joblib>=1.4.0",
    "mapclassify>=2.5.0",
    "matplotlib>=3.7.0",
    "networkx>=3.0",
    "numpy>=1.26.4",
    "pandas>=2.3.1",
    "pyarrow>=11.0.0",
    "pyproj>=3.6.1",
    "rasterio>=1.3.8",
    "requests>=2.28.2",
    "rtree>=1.0.1",
    "scikit-learn>=1.5.2",
    "shapely>=2.1.2",
    "typing-extensions>=4.11.0",
    "xyzservices>=2023.2.0",
]

[tool.poetry]
name = "ssb-sgis"
version = "1.5.0"
description = "GIS functions used at Statistics Norway."
authors = ["Morten Letnes <morten.letnes@ssb.no>"]
packages = [{ include = "sgis", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
pydoclint = ">=0.9.1"

[project.urls]
Changelog = "https://github.com/statisticsnorway/ssb-sgis/releases"
homepage = "https://github.com/statisticsnorway/ssb-sgis"
repository = "https://github.com/statisticsnorway/ssb-sgis"
documentation = "https://statisticsnorway.github.io/ssb-sgis"

[project.optional-dependencies]
dask = [
    "dask>=2024.1.1",
]
gcsfs = [
    "gcsfs>=2024.3.1",
]
all = [
    "pyogrio>=0.7.0",
    "xarray>=2024.3.0",
    "rioxarray>=0.15.5",
    "gcsfs>=2024.3.1",
    "dask>=2024.1.1",
]
bucket = [
    "gcsfs>=2024.3.1",
]
xarray = [
    "xarray>=2024.3.0",
    "rioxarray>=0.15.5",
]
test = [
    "xarray>=2024.3.0",
    "rioxarray>=0.15.5",
    "dask>=2024.1.1",
]

[project.scripts]
ssb-sgis = "sgis.__main__:main"

[dependency-groups]
lint = [
    "black[jupyter]>=25.11.0",
    "pre-commit>=4.4.0",
    "pre-commit-hooks>=6.0.0",
    "pydoclint>=0.8.3",
    "ruff>=0.14.5",
]
doc = [
    "furo>=2025.9.25",
    "myst-parser>=4.0.1",
    "sphinx>=8.2.3",
    "sphinx-autobuild>=2025.8.25",
    "sphinx-autodoc-typehints>=3.5.2",
    "sphinx-click>=6.1.0",
]

# Type hint stubs should be placed in the dev dependency group
dev = [
    {include-group = "lint"},
    {include-group = "doc"},
    "coverage[toml]>=7.11.3",
    "deptry>=0.24.0; python_version < '4.0'",
    "mypy>=1.18.2",
    "pygments>=2.19.0",
    "pytest>=9.0.0",
    "typeguard>=2.13.3",
    "xdoctest[colors]>=1.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.coverage.paths]
source = ["src", "*/site-packages"]
tests = ["tests", "*/tests"]

[tool.coverage.run]
branch = true
source = ["sgis", "tests"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 50

[tool.mypy]
strict = false
warn_unreachable = true
pretty = true
show_column_numbers = true
show_error_context = true

[[tool.mypy.overrides]]
module = [
    "affine.*",
    "branca.*",
    "dapla.*",
    "folium.*",
    "gcsfs.*",
    "geocoder.*",
    "geopandas.*",
    "igraph.*",
    "jenkspy.*",
    "joblib.*",
    "mapclassify.*",
    "networkx.*",
    "osmapi.*",
    "pyarrow.*",
    "rasterio.*",
    "shapely.*",
    "sklearn.neighbors.*",
    "xyzservices.*",
]
ignore_missing_imports = true

[tool.pydoclint]
style = "google"
exclude = '\.git|\.nox'
arg-type-hints-in-docstring = false
check-return-types = false
check-yield-types = false
allow-init-docstring = true
quiet = true

[tool.ruff]
force-exclude = true  # Apply excludes to pre-commit
show-fixes = true
src = ["src", "tests"]
target-version = "py312"  # Minimum Python version supported
include = ["*.py", "*.pyi", "**/pyproject.toml", "*.ipynb"]
extend-exclude = [
    "__pycache__",
    "old",
    ".ipynb_checkpoints",
    "noxfile.py",
    "docs/conf.py",
]

# Ruff rules may be customized as desired: https://docs.astral.sh/ruff/rules/
[tool.ruff.lint]
select = [
    "A",    # prevent using keywords that clobber python builtins
    "ANN",  # check type annotations
    "B",    # bugbear: security warnings
    "D",    # documentation
    "E",    # pycodestyle
    "F",    # pyflakes
    "ISC",  # implicit string concatenation
    "UP",   # alert you when better syntax is available in your python version
    "RUF",  # the ruff developer's own rules
]
ignore = [
    "ANN002", # Typehint *args
    "ANN003", # Typehint **kwargs
    "ANN101", # Supress missing-type-self.
    "ANN102", # Supress missing-type-cls.
    "ANN202", # Don't require return type annotation for private functions.
    "ANN401", # Allow type annotation with type Any.
    "D100",   # Supress undocumented-public-module. Only doc of public api required.
    "E402",   # Supress module-import-not-at-top-of-file, needed in jupyter notebooks.
    "E501",   # Supress line-too-long warnings: trust black's judgement on this one.
    "D104",   # Missing docstring in public package
    "FBT001", # Allow boolean positional arguments in a function.
    "FBT002", # Allow boolean default positional arguments in a function.
    "RUF018", # Avoid assignment expressions in `assert` statements
    "RUF005", # Consider `["_cluster", *by]` instead of concatenation
    "F841",   # Local variable is assigned to but never used
    "B019",   # Use of `functools.lru_cache` or `functools.cache` on methods can lead to memory leaks
    "UP038",  # Use `X | Y` in `isinstance` call instead of `(X, Y)`
    "B023",   # Function definition does not bind loop variable
    "ANN001", # TODO temporary. Missing type annotation for function argument ...
    "D103",   # TODO temporary. Missing docstring in public function
    "B018",   # Found useless expression
    "E712",   # Avoid equality comparisons to `True`; use `if x:` for truth checks (because 'is' doesn't work with numpy/pandas)
    "PLR2004", # Allow to compare with unnamed numerical constants.
]
external = ["DOC"]  # Avoiding removing any codes starting with `DOC` from any `# noqa` directives.

[tool.ruff.lint.isort]
force-single-line = true

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pydocstyle]
convention = "google"  # You can also use "numpy".

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod", "validator", "root_validator", "pydantic.validator"]

[tool.ruff.lint.per-file-ignores]
"*/__init__.py" = ["F401"]
"**/tests/*" = [
    "ANN001",  # type annotations don't add value for test functions
    "ANN002",  # type annotations don't add value for test functions
    "ANN003",  # type annotations don't add value for test functions
    "ANN201",  # type annotations don't add value for test functions
    "ANN204",  # type annotations don't add value for test functions
    "ANN205",  # type annotations don't add value for test functions
    "ANN206",  # type annotations don't add value for test functions
    "D100",    # docstrings are overkill for test functions
    "D101",
    "D102",
    "D103",
    "S101",    # asserts are encouraged in pytest
]

[tool.jupytext]
formats = "ipynb,auto:percent"
notebook_metadata_filter = "jupytext.text_representation,-jupytext.text_representation.jupytext_version,-widgets,-varInspector,-kernelspec"
cell_metadata_filter = "-all"

[tool.isort]
profile = "black"
force_single_line = true
skip_gitignore = true
# The line below is needed for jupyter notebooks stored as .py in percent format.
# See https://github.com/PyCQA/isort/issues/1338 for details
treat_comments_as_code = ["# %%"]

[tool.deptry.per_rule_ignores]
DEP001 = ["sgis", "nox", "nox_poetry"]  # packages available by default

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
